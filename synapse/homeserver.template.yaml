# Configuration file for Synapse.
#
# This is a YAML file: see [1] for a quick introduction. Note in particular
# that *indentation is important*: all the elements of a list or dictionary
# should have the same indentation.
#
# [1] https://docs.ansible.com/ansible/latest/reference_appendices/YAMLSyntax.html
#
# For more information on how to configure Synapse, including a complete accounting of
# each option, go to docs/usage/configuration/config_documentation.md or
# https://element-hq.github.io/synapse/latest/usage/configuration/config_documentation.html
server_name: "matrix.${DOMAIN}"
public_baseurl: "https://matrix.${DOMAIN}/"
pid_file: /data/homeserver.pid
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation]
        compress: false
database:
  name: sqlite3
  args:
    database: /data/homeserver.db
log_config: "/data/matrix.${DOMAIN}.log.config"
media_store_path: /data/media_store
registration_shared_secret: "${MATRIX_REGISTRATION_SHARED_SECRET}"
report_stats: false
macaroon_secret_key: "${MATRIX_MACAROON_SECRET_KEY}"
form_secret: "${MATRIX_FORM_SECRET}"
signing_key_path: "/data/matrix.${DOMAIN}.signing.key"
trusted_key_servers:
  - server_name: "matrix.org"
suppress_key_server_warning: true

jwt_config:
  enabled: true
  secret: "${JWT_SECRET}"
  algorithm: "HS256"
  subject_claim: "matrixUserId"

oidc_providers:
  - idp_id: google
    idp_name: "Google"
    issuer: "https://accounts.google.com"
    skip_verification: true
    client_id: "${OPENID_CLIENT_ID}"
    client_secret: "${OPENID_CLIENT_SECRET}"
    scopes: ["openid", "profile", "email"]
    user_profile_method: "userinfo_endpoint"
    user_mapping_provider:
      config:
        localpart_template: "{{ user.email.split('@')[0] }}"
        display_name_template: "{{ user.name }}"
        email_template: "{{ user.email }}"

sso:
  client_whitelist:
    - https://${DOMAIN}/

enable_registration: true
enable_registration_without_verification: true
turn_allow_guests: true
allow_guest_access: true

# Development server only: we allow creating publicly visible rooms to anyone.
room_list_publication_rules:
  - "action": "allow"

auto_join_rooms:
  - "#general:matrix.${DOMAIN}"

autocreate_auto_join_rooms: true
# vim:ft=yaml

user_directory:
  search_all_users: true

rc_login:
  address:
    per_second: 0.15
    burst_count: 10
  account:
    per_second: 0.18
    burst_count: 10
  failed_attempts:
    per_second: 0.19
    burst_count: 10
rc_room_creation:
  per_second: 10
  burst_count: 10000
