name: Upload WA maps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maps

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Extract UPLOAD_MODE from Environment Variables
        env:
          UPLOAD_MODE: ${{ secrets.UPLOAD_MODE }}
        run: |
          case "$UPLOAD_MODE" in
            MAP_STORAGE|GH_PAGES) ;;
            *)
              echo "Error: UPLOAD_MODE must be either MAP_STORAGE or GH_PAGES."
              exit 1
              ;;
          esac
          echo "UPLOAD_MODE=$UPLOAD_MODE" >> "$GITHUB_ENV"

      - name: Set up Environment Variables
        env:
          MAP_STORAGE_API_KEY: ${{ secrets.MAP_STORAGE_API_KEY }}
          MAP_STORAGE_URL: ${{ secrets.MAP_STORAGE_URL }}
          UPLOAD_DIRECTORY: ${{ secrets.UPLOAD_DIRECTORY }}
        run: |
          if [ "$UPLOAD_MODE" = "MAP_STORAGE" ]; then
            if [ -z "$MAP_STORAGE_API_KEY" ]; then
              echo "Error: MAP_STORAGE_API_KEY is not set in GitHub Secrets."
              exit 1
            fi
            if [ -z "$MAP_STORAGE_URL" ]; then
              echo "Error: MAP_STORAGE_URL is not set in GitHub Secrets."
              exit 1
            fi
            echo "MAP_STORAGE_API_KEY=$MAP_STORAGE_API_KEY" >> "$GITHUB_ENV"
            echo "MAP_STORAGE_URL=$MAP_STORAGE_URL" >> "$GITHUB_ENV"

            if [ -n "$UPLOAD_DIRECTORY" ]; then
              echo "UPLOAD_DIRECTORY=$UPLOAD_DIRECTORY" >> "$GITHUB_ENV"
            else
              USERNAME="${{ github.repository_owner }}"
              REPO="${{ github.event.repository.name }}"
              UPLOAD_DIRECTORY="${USERNAME}-${REPO}"
              echo "UPLOAD_DIRECTORY=$UPLOAD_DIRECTORY" >> "$GITHUB_ENV"
              echo "Warning: UPLOAD_DIRECTORY was not found; set to $UPLOAD_DIRECTORY."
            fi
          fi

      - name: Deploy using WA Map Storage
        if: ${{ env.UPLOAD_MODE == 'MAP_STORAGE' }}
        run: npm run upload-only

      - name: Deploy using Github Pages
        if: ${{ env.UPLOAD_MODE == 'GH_PAGES' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: maps/dist/
